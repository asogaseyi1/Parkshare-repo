spring.application.name=Parkshare
spring.data.mongodb.uri=${MONGODB_URI}
server.port=${PORT:8080}
stripe.secret.key=${STRIPE_SECRET_KEY}

# Airbnb-style split: guests pay the rate plus this fee (and tax); hosts
# receive the rate minus this smaller fee. See PricingService.
pricing.guest-service-fee-percent=14.0
pricing.host-service-fee-percent=3.0


